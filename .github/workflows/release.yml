name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: move dist\cc-nano.exe dist\cc-nano-windows.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-windows
          path: dist/cc-nano-windows.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-macos
          path: dist/cc-nano-macos

  build-linux-standard:
    name: Build Linux (glibc, Ubuntu latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux
          path: dist/cc-nano-linux

  build-linux-compat:
    name: Build Linux (glibc, Ubuntu 20.04 for compatibility)
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux-compat
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-compat
          path: dist/cc-nano-linux-compat

  build-linux-musl:
    name: Build Linux (musl static, Alpine container)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
    steps:
      - name: Install system dependencies
        run: apk add --no-cache git build-base
      - uses: actions/checkout@v6
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux-musl
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-musl
          path: dist/cc-nano-linux-musl

  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-macos, build-linux-standard, build-linux-compat, build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -R artifacts
          find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🎉 cc-nano v${{ github.ref_name }}

            感谢使用 cc-nano！这是自动化构建的多平台二进制发布。

            ### 📦 下载与使用

            #### Windows
            直接双击 `cc-nano-windows.exe` 或在命令行中运行。

            #### macOS
            ```bash
            chmod +x cc-nano-macos
            ./cc-nano-macos
            ```
            > 如果提示“无法验证开发者”，执行 `xattr -d com.apple.quarantine cc-nano-macos`

            #### Linux (glibc, 现代发行版)
            ```bash
            chmod +x cc-nano-linux
            ./cc-nano-linux
            ```

            #### Linux (glibc, 兼容旧发行版)
            ```bash
            chmod +x cc-nano-linux-compat
            ./cc-nano-linux-compat
            ```

            #### Linux (musl 静态链接，通用)
            ```bash
            chmod +x cc-nano-linux-musl
            ./cc-nano-linux-musl
            ```

            ### 📄 源代码
            标签：[`${{ github.ref_name }}`](https://github.com/cipologic/cc-nano/tree/${{ github.ref_name }})

            ### 🤝 反馈与贡献
            欢迎提交 Issue 或 Pull Request！
          draft: false
          prerelease: false
          files: |
            artifacts/**/cc-nano-windows.exe
            artifacts/**/cc-nano-macos
            artifacts/**/cc-nano-linux
            artifacts/**/cc-nano-linux-compat
            artifacts/**/cc-nano-linux-musl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_OWNER: "cipologic"
          REPO_NAME: "cc-nano"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 测试鉴权
          USER_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" https://gitee.com/api/v5/user | jq -r '.login')
          if [ "$USER_TEST" == "null" ]; then
            echo "Token invalid"
            exit 1
          fi
          # 检查仓库
          REPO_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}")
          if echo "$REPO_TEST" | grep -q "Not Found"; then
            echo "Repository not found"
            exit 1
          fi
          # 查询已有 Release
          EXIST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG_NAME}")
          RELEASE_ID=$(echo $EXIST | jq -r '.id')
          if [ "$RELEASE_ID" == "null" ]; then
            # 创建 Release，指定 target_commitish
            RESP=$(curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\",\"body\":\"Auto sync from GitHub\",\"prerelease\":false,\"target_commitish\":\"main\"}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases)
            RELEASE_ID=$(echo $RESP | jq -r '.id')
            if [ "$RELEASE_ID" == "null" ]; then
              echo "Failed to create release: $(echo $RESP | jq -r '.message // .')"
              exit 1
            fi
          else
            echo "Release already exists (id=$RELEASE_ID)"
          fi
          # 上传所有产物
          find artifacts -type f \( -name "cc-nano-windows.exe" -o -name "cc-nano-macos" -o -name "cc-nano-linux" -o -name "cc-nano-linux-compat" -o -name "cc-nano-linux-musl" \) | while read file; do
            echo "Uploading $file ..."
            curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${file}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/${RELEASE_ID}/attach_files
          done