name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: move dist\cc-nano.exe dist\cc-nano-windows.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-windows
          path: dist/cc-nano-windows.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-macos
          path: dist/cc-nano-macos

  # ==================== Linux 构建部分 ====================
  # 兼容 Ubuntu 20.04+ / Debian 11+ (glibc >= 2.31)
  build-linux-compat:
    name: Build Linux (glibc 2.31, Ubuntu 20.04 compatible)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    steps:
      - name: Install system dependencies and Python 3.12
        run: |
          apt-get update
          apt-get install -y software-properties-common curl git build-essential
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.12 python3.12-distutils python3.12-venv
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.12
          export PATH=/root/.local/bin:$PATH
          echo "export PATH=/root/.local/bin:$PATH" >> ~/.bashrc
      - uses: actions/checkout@v6
        with:
          set-safe-directory: true
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux-glibc-2.31
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-glibc-2.31
          path: dist/cc-nano-linux-glibc-2.31

  # 兼容 CentOS 7 / RHEL 7 / Amazon Linux 2 (glibc 2.17)
  build-linux-centos7:
    name: Build Linux (glibc 2.17, CentOS 7 compatible)
    runs-on: ubuntu-latest
    container:
      image: centos:7
      options: --user root
    steps:
      - name: Install system dependencies and Python 3.12
        run: |
          # 安装 EPEL 和 IUS 仓库，获取 Python 3.12
          yum install -y epel-release
          yum install -y https://repo.ius.io/ius-release-el7.rpm
          yum install -y gcc gcc-c++ make git python312 python312-pip python312-devel
          # 创建软链接使 python3 指向 python3.12
          ln -sf /usr/bin/python3.12 /usr/bin/python3
          # 升级 pip
          python3 -m pip install --upgrade pip
      - uses: actions/checkout@v6
        with:
          set-safe-directory: true
      - name: Install Poetry
        run: python3 -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux-glibc-2.17
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-glibc-2.17
          path: dist/cc-nano-linux-glibc-2.17

  # 静态链接 musl，适用于任何 Linux x86_64（Alpine、旧发行版等）
  build-linux-musl:
    name: Build Linux (musl static, Alpine container)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
    steps:
      - name: Install system dependencies
        run: apk add --no-cache git build-base
      - uses: actions/checkout@v6
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux-musl
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-musl
          path: dist/cc-nano-linux-musl

  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-macos, build-linux-compat, build-linux-centos7, build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -R artifacts
          find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🎉 cc-nano v${{ github.ref_name }}

            感谢使用 cc-nano！这是自动化构建的多平台二进制发布。

            ### 📦 下载与使用

            #### Windows
            直接双击 `cc-nano-windows.exe` 或在命令行中运行。

            #### macOS
            ```bash
            chmod +x cc-nano-macos
            ./cc-nano-macos
            ```
            > 如果提示“无法验证开发者”，执行 `xattr -d com.apple.quarantine cc-nano-macos`

            #### Linux 版本选择指南

            我们提供了三种 Linux 二进制文件，各自适配不同年代的发行版：

            | 二进制文件 | 最低 glibc | 适用发行版（例） | 推荐使用场景 |
            |-----------|-----------|----------------|--------------|
            | `cc-nano-linux-glibc-2.31` | 2.31 | Ubuntu 20.04+, Debian 11+, RHEL 9+, Fedora 35+, openSUSE Leap 15.3+ | **大多数现代 Linux 用户**，平衡兼容性与性能 |
            | `cc-nano-linux-glibc-2.17` | 2.17 | CentOS 7, RHEL 7, Amazon Linux 2, 以及其他 glibc 2.17+ 的旧发行版 | **老旧企业环境**（如 CentOS 7 仍在生产中的场景） |
            | `cc-nano-linux-musl` | 无依赖（静态链接） | **任何 Linux x86_64**（包括 Alpine、CentOS 7、Ubuntu 等所有发行版） | **追求最大兼容性**，或使用 musl libc 的发行版（如 Alpine） |

            **使用建议：**
            - 如果你不确定自己的系统版本，优先尝试 `cc-nano-linux-musl`（最常见，几乎总能运行）。
            - 如果 musl 版本因某些 C 扩展问题无法工作，再尝试 `cc-nano-linux-glibc-2.31`。
            - 如果系统是 CentOS 7 / RHEL 7 且 glibc 2.31 版本无法运行，请使用 `cc-nano-linux-glibc-2.17`。

            **运行命令：**
            ```bash
            # 下载对应的二进制文件后
            chmod +x cc-nano-linux-*
            ./cc-nano-linux-<版本>
            ```

            ### 📄 源代码
            标签：[`${{ github.ref_name }}`](https://github.com/cipologic/cc-nano/tree/${{ github.ref_name }})

            ### 🤝 反馈与贡献
            欢迎提交 Issue 或 Pull Request！
          draft: false
          prerelease: false
          files: |
            artifacts/**/cc-nano-windows.exe
            artifacts/**/cc-nano-macos
            artifacts/**/cc-nano-linux-glibc-2.31
            artifacts/**/cc-nano-linux-glibc-2.17
            artifacts/**/cc-nano-linux-musl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同步到 Gitee（保持不变，仅修改文件匹配模式）
      - name: Sync Release to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_OWNER: "cipologic"
          REPO_NAME: "cc-nano"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          USER_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" https://gitee.com/api/v5/user | jq -r '.login')
          if [ "$USER_TEST" == "null" ]; then
            echo "Token invalid"
            exit 1
          fi
          REPO_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}")
          if echo "$REPO_TEST" | grep -q "Not Found"; then
            echo "Repository not found"
            exit 1
          fi
          EXIST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG_NAME}")
          RELEASE_ID=$(echo $EXIST | jq -r '.id')
          if [ "$RELEASE_ID" == "null" ]; then
            RESP=$(curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\",\"body\":\"Auto sync from GitHub\",\"prerelease\":false,\"target_commitish\":\"main\"}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases)
            RELEASE_ID=$(echo $RESP | jq -r '.id')
            if [ "$RELEASE_ID" == "null" ]; then
              echo "Failed to create release: $(echo $RESP | jq -r '.message // .')"
              exit 1
            fi
          else
            echo "Release already exists (id=$RELEASE_ID)"
          fi
          find artifacts -type f \( -name "cc-nano-windows.exe" -o -name "cc-nano-macos" -o -name "cc-nano-linux-glibc-2.31" -o -name "cc-nano-linux-glibc-2.17" -o -name "cc-nano-linux-musl" \) | while read file; do
            echo "Uploading $file ..."
            curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${file}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/${RELEASE_ID}/attach_files
          done
