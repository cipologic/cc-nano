name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --strip --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: move dist\cc-nano.exe dist\cc-nano-windows.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-windows
          path: dist/cc-nano-windows.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --strip --name cc-nano src/cc_nano/tui/app.py
      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-macos
          path: dist/cc-nano-macos

  # ==================== Linux 构建（glibc 2.28+ 兼容） ====================
  build-linux:
    name: Build Linux (glibc 2.28+)
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    steps:
      - name: Install Python 3.12 and tools
        run: |
          dnf install -y epel-release
          dnf install -y python3.12 python3.12-pip python3.12-devel gcc gcc-c++ make git
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/pip3.12 /usr/local/bin/pip3
      - uses: actions/checkout@v6
      - name: Install Poetry and dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install poetry
          poetry config virtualenvs.create true
          poetry install --no-interaction --no-root
      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --strip --name cc-nano src/cc_nano/tui/app.py
      - name: Rename binary
        run: mv dist/cc-nano dist/cc-nano-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux
          path: dist/cc-nano-linux

  release:
    name: Create Release and Upload Assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🎉 cc-nano ${{ github.ref_name }}

            感谢使用 cc-nano！这是自动化构建的多平台二进制发布。

            ### 📦 下载与使用

            #### Windows
            直接双击 `cc-nano-windows.exe` 或在命令行中运行。

            #### macOS
            ```bash
            chmod +x cc-nano-macos
            ./cc-nano-macos
            ```
            > 如果提示“无法验证开发者”，执行 `xattr -d com.apple.quarantine cc-nano-macos`

            #### Linux
            `cc-nano-linux` 基于 **AlmaLinux 8** 构建，要求 **glibc ≥ 2.28**。  
            以下主流发行版均可直接运行：

            | 发行版               | 最低版本                  | glibc 版本 |
            |----------------------|---------------------------|------------|
            | Ubuntu               | 20.04 LTS                 | 2.31       |
            | Debian               | 11                        | 2.31       |
            | RHEL / CentOS        | 8                         | 2.28       |
            | Rocky Linux / AlmaLinux | 8                      | 2.28       |
            | Fedora               | 35                        | 2.34       |
            | openSUSE Leap        | 15.3                      | 2.31       |
            | Arch Linux           | 任何近期版本              | ≥2.35      |

            **不支持的系统**：CentOS 7 / RHEL 7（glibc 2.17）。  
            如您必须使用 CentOS 7，建议通过 Docker 运行（`docker run -it --rm -v .:/work alpine:3.19 /work/cc-nano-linux`）或使用旧版本。

            **运行命令：**
            ```bash
            chmod +x cc-nano-linux
            ./cc-nano-linux
            ```

            ### 🤝 反馈与贡献
            欢迎提交 Issue 或 Pull Request！
          draft: false
          prerelease: false
          files: |
            artifacts/**/cc-nano-windows.exe
            artifacts/**/cc-nano-macos
            artifacts/**/cc-nano-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_OWNER: "cipologic"
          REPO_NAME: "cc-nano"
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 从 GitHub 获取 Release 正文
          GH_RELEASE=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG_NAME}")
          GH_BODY=$(echo "$GH_RELEASE" | jq -r '.body')
          if [ "$GH_BODY" == "null" ] || [ -z "$GH_BODY" ]; then
            GH_BODY="Auto sync from GitHub"
          fi
          ESCAPED_BODY=$(jq -s -R -r @json <<< "$GH_BODY")

          # Gitee 鉴权
          USER_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" https://gitee.com/api/v5/user | jq -r '.login')
          if [ "$USER_TEST" == "null" ]; then
            echo "Invalid Gitee token"
            exit 1
          fi
          # 检查仓库
          REPO_TEST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}")
          if echo "$REPO_TEST" | grep -q "Not Found"; then
            echo "Repository not found"
            exit 1
          fi
          # 获取或创建 Release
          EXIST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG_NAME}")
          RELEASE_ID=$(echo $EXIST | jq -r '.id')
          if [ "$RELEASE_ID" == "null" ]; then
            RESP=$(curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\",\"body\":${ESCAPED_BODY},\"prerelease\":false,\"target_commitish\":\"main\"}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases)
            RELEASE_ID=$(echo $RESP | jq -r '.id')
            if [ "$RELEASE_ID" == "null" ]; then
              echo "Failed to create release: $(echo $RESP | jq -r '.message // .')"
              exit 1
            fi
            echo "Created release id $RELEASE_ID"
          else
            echo "Release already exists (id=$RELEASE_ID), skipping body update"
          fi
          # 上传产物（带重试）
          find artifacts -type f \( -name "cc-nano-windows.exe" -o -name "cc-nano-macos" -o -name "cc-nano-linux" \) | while read file; do
            echo "Uploading $file ..."
            for i in 1 2 3; do
              RESP=$(curl -s --connect-timeout 120 --max-time 2400 \
                -X POST \
                -H "Authorization: token ${GITEE_TOKEN}" \
                -F "file=@${file}" \
                https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/${RELEASE_ID}/attach_files)
              if echo "$RESP" | jq -e '.id' >/dev/null 2>&1; then
                echo "Upload success: $(echo "$RESP" | jq -r '.name')"
                break
              else
                echo "Upload failed (attempt $i): $RESP"
                if [ $i -eq 3 ]; then exit 1; fi
                sleep 5
              fi
            done
          done
