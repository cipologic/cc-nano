name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'          # 推送形如 v1.0.0 的标签时触发
  workflow_dispatch:      # 也支持手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # 根据你的项目修改

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build with PyInstaller
        run: poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py

      - name: Rename executable for platform
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/cc-nano dist/cc-nano-linux
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/cc-nano.exe dist/cc-nano-windows.exe
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/cc-nano dist/cc-nano-macos
          fi

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: cc-nano-${{ runner.os }}
          path: dist/cc-nano-*

  release:
    name: Create Release and Upload Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
              ## 🎉 cc-nano v${{ github.ref_name }}

              感谢使用 cc-nano！这是自动化构建的多平台二进制发布。

              ### 📦 下载与使用

              #### Linux / macOS
              ```bash
              # 下载对应平台的可执行文件
              # 添加执行权限（Linux/macOS）
              chmod +x cc-nano-linux   # 或 cc-nano-macos
              ./cc-nano-linux
              ```

              #### Windows
              直接双击 `cc-nano-windows.exe` 即可运行，或在命令行中执行：
              ```cmd
              cc-nano-windows.exe
              ```

              ### 🍎 macOS 用户特别注意
              由于该二进制文件未经过 Apple 官方公证，macOS 可能会提示“无法验证开发者”或“已损坏”。  
              **解决方法**：打开终端，进入下载目录，执行以下命令解除隔离：
              ```bash
              xattr -d com.apple.quarantine cc-nano-macos
              ```
              然后再次尝试运行。

              ### 📄 源代码
              本版本对应的源码标签为 [`${{ github.ref_name }}`](https://github.com/cipologic/cc-nano/tree/${{ github.ref_name }})  
              Gitee 镜像：[cipologic/cc-nano](https://gitee.com/cipologic/cc-nano)

              ### 🤝 反馈与贡献
              欢迎提交 Issue 或 Pull Request！
          draft: false
          prerelease: false
          files: |
            artifacts/**/cc-nano-linux
            artifacts/**/cc-nano-windows.exe
            artifacts/**/cc-nano-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 可选：同步 Release 到 Gitee
      - name: Sync Release to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_OWNER: "cipologic"
          REPO_NAME: "cc-nano"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 查询是否已存在 Release
          EXIST=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG_NAME}")
          RELEASE_ID=$(echo $EXIST | jq -r '.id')
          if [ "$RELEASE_ID" == "null" ]; then
            # 创建新 Release
            RESP=$(curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\",\"body\":\"Auto sync from GitHub\",\"prerelease\":false}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases)
            RELEASE_ID=$(echo $RESP | jq -r '.id')
            if [ "$RELEASE_ID" == "null" ]; then
              echo "Failed to create release on Gitee: $(echo $RESP | jq -r '.message')"
              exit 1
            fi
          else
            echo "Release already exists, will upload assets to existing release (id=${RELEASE_ID})"
          fi
          # 上传附件（使用 find 避免 glob 问题）
          find artifacts -type f -name "cc-nano-*" | while read file; do
            echo "Uploading $file ..."
            curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${file}" \
              https://gitee.com/api/v5/repos/${REPO_OWNER}/${REPO_NAME}/releases/${RELEASE_ID}/attach_files
          done