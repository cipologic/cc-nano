name: Test Linux (glibc 2.17+) Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build compatible Linux binary
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    steps:
      - name: Install Python 3.12 from IUS
        run: |
          yum install -y epel-release
          yum install -y https://repo.ius.io/ius-release-el7.rpm
          yum install -y python312 python312-pip python312-devel
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/pip3.12 /usr/local/bin/pip3

      - uses: actions/checkout@v6

      - name: Export poetry dependencies to requirements.txt
        run: |
          python3 -m pip install poetry
          python3 -m poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Install dependencies with manylinux2014 platform constraint
        run: |
          python3 -m pip install --platform manylinux2014_x86_64 --only-binary :all: -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build binary with PyInstaller
        run: python3 -m PyInstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py

      - name: Rename executable
        run: mv dist/cc-nano dist/cc-nano-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux
          path: dist/cc-nano-linux