name: Test Linux (glibc 2.17+) Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'test-linux-build'
      - 'main'

jobs:
  build-linux-compatible:
    name: Build Linux compatible binary (glibc 2.17)
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make git python3.12 python3.12-pip python3.12-devel

      - uses: actions/checkout@v6

      - name: Upgrade pip without platform restrictions
        run: |
          python3.12 -m pip install --upgrade pip

      - name: Install Poetry and dependencies with manylinux2014 compatibility
        run: |
          export PIP_PLATFORM=manylinux2014_x86_64
          export PIP_ONLY_BINARY=:all:
          python3.12 -m pip install poetry
          python3.12 -m poetry config virtualenvs.create true
          python3.12 -m poetry install --no-interaction --no-root

      - name: Build with PyInstaller
        run: |
          python3.12 -m poetry run pyinstaller --clean --onefile --name cc-nano src/cc_nano/tui/app.py

      - name: Rename artifact
        run: mv dist/cc-nano dist/cc-nano-linux-glibc-2.17

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cc-nano-linux-glibc-2.17
          path: dist/cc-nano-linux-glibc-2.17
          if-no-files-found: error

      - name: Show binary info
        run: |
          file dist/cc-nano-linux-glibc-2.17
          ldd dist/cc-nano-linux-glibc-2.17 || echo "ldd not available"